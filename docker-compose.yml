version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trace-point-backend
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - APP_MODE=debug
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - trace-point-network

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: trace-point-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - trace-point-network

networks:
  trace-point-network:
    driver: bridge